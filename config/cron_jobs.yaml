# PersonalKM launchd jobs — managed by scripts/manage_cron.py
#
# Consolidated 02:00 – 07:00 once-daily schedule (GMT+8 / Asia/Taipei).
# Each Phase A / B / C main script sequentially chains Tech Vault → Lifestyle Vault
# to prevent git lock collisions and Ollama contention.
# All 4 jobs set run_at_load: true with upstream lock waiting so booting the
# Mac Mini in the morning after an overnight shutdown catches up in order:
#   Phase A (Tech→Lifestyle) → Phase GPS → Phase B (Tech→Lifestyle) → Phase C (Tech→Lifestyle)

defaults:
  repo_root: ~/Documents/GitHub/DannyTsao/PersonalKM
  python: /Users/dannytsao/.hermes/hermes-agent/venv/bin/python3
  secrets: ~/.personalkm/worker.secrets

vaults:
  tech:
    path: ~/Documents/PersonalKM/Personalkm-vault
  lifestyle:
    path: ~/Documents/PersonalKM/Personalkm-lifestyle-vault

jobs:
  phase-a-ingest:
    script: run_mac_mini_phase_a.sh
    companion_scripts:
      - run_mac_mini_phase_a_lifestyle.sh
    vault: tech
    run_at_load: true
    schedule:
      times: ["02:10"]
    log_name: phase-a

  phase-gps-lifestyle:
    script: run_mac_mini_phase_gps_lifestyle.sh
    vault: lifestyle
    run_at_load: true
    schedule:
      times: ["03:00"]
    log_name: phase-gps-lifestyle

  phase-b-tech:
    script: run_mac_mini_phase_b.sh
    companion_scripts:
      - run_mac_mini_phase_b_lifestyle.sh
    vault: tech
    run_at_load: true
    schedule:
      times: ["03:30"]
    log_name: phase-b

  phase-c-distill:
    script: run_mac_mini_phase_c.sh
    companion_scripts:
      - run_mac_mini_phase_c_lifestyle.sh
    vault: tech
    run_at_load: true
    schedule:
      times: ["05:00"]
    log_name: phase-c
